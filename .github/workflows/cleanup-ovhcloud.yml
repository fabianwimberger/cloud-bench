name: Cleanup OVHcloud Orphans

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Find and terminate orphaned OVHcloud instances
        env:
          OVH_OPENSTACK_USERNAME: ${{ secrets.OVH_OPENSTACK_USERNAME }}
          OVH_OPENSTACK_PASSWORD: ${{ secrets.OVH_OPENSTACK_PASSWORD }}
          OVH_CLOUD_PROJECT_ID: ${{ secrets.OVH_CLOUD_PROJECT_ID }}
        run: |
          if [ -z "$OVH_OPENSTACK_USERNAME" ]; then
            echo "OVHcloud credentials not configured, skipping"
            exit 0
          fi

          echo "Checking for orphaned OVHcloud instances..."

          # Source: https://docs.ovh.com/gb/en/public-cloud/sourcing-openstack-variables/
          export OS_AUTH_URL=https://auth.cloud.ovh.net/v3
          export OS_IDENTITY_API_VERSION=3
          export OS_USER_DOMAIN_NAME=Default
          export OS_PROJECT_DOMAIN_NAME=Default
          export OS_REGION_NAME=DE1
          export OS_USERNAME="$OVH_OPENSTACK_USERNAME"
          export OS_PASSWORD="$OVH_OPENSTACK_PASSWORD"
          export OS_TENANT_ID="$OVH_CLOUD_PROJECT_ID"

          # Install OpenStack CLI
          pip install python-openstackclient

          # Find cloud-bench tagged instances older than 2 hours
          CUTOFF=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -u -v-2H +%Y-%m-%dT%H:%M:%S)

          SERVERS=$(openstack server list -f json 2>/dev/null | jq -r --arg cutoff "$CUTOFF" '
            .[] | select(.Name | startswith("cloud-bench-")) |
            select(."Created At" < $cutoff) |
            [.ID, .Name, ."Created At"] | @tsv
          ' || echo "")

          if [ -z "$SERVERS" ]; then
            echo "[OK] No orphaned OVHcloud instances found"
            exit 0
          fi

          echo "Found orphaned instances:"
          echo "$SERVERS"

          # Terminate orphaned instances
          TERMINATED=0
          while IFS=$'\t' read -r id name created; do
            echo "Terminating orphaned instance: $name ($id, created: $created)"
            openstack server delete "$id" || echo "Failed to delete $id"
            TERMINATED=$((TERMINATED + 1))
          done <<< "$SERVERS"

          echo ""
          echo "Summary: Terminated $TERMINATED orphaned instance(s)"

          if [ $TERMINATED -gt 0 ]; then
            echo "## OVHcloud Orphan Cleanup" >> $GITHUB_STEP_SUMMARY
            echo "Terminated **$TERMINATED** orphaned instance(s) older than 2 hours." >> $GITHUB_STEP_SUMMARY
          fi
